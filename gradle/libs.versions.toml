[versions]
kotlin = "2.3.21"
kotest = "5.8.0"
coroutines = "1.11.0"
javaVersion = "21"
springBoot = "3.2.2"
jackson = "2.18.4"
springdoc = "2.8.9"
mcp = "0.14.0"
blockhound = "1.0.8.RELEASE"
googleCloudBom = "26.54.0"
kotestSpringExtension = "1.1.3"

[libraries]
# Kotlin
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
mcp-kotlin-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp" }
kotest-extensions-blockhound = { module = "io.kotest:kotest-extensions-blockhound-jvm", version.ref = "kotest" }
blockhound = { module = "io.projectreactor.tools:blockhound", version.ref = "blockhound" }

# Spring Boot WebFlux
springBootStarterWebflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "springBoot" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }

# Jackson
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Testing (Kotest)
kotest-runner = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-spring-extension = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotestSpringExtension" }

# SpringDoc OpenAPI (Swagger UI for WebFlux)
springdocOpenapiWebfluxUi = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
googleCloudLibrariesBom = { module = "com.google.cloud:libraries-bom", version.ref = "googleCloudBom" }
googleCloudLogging = { module = "com.google.cloud:google-cloud-logging" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }